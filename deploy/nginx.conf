# Nginx reverse proxy for the AI Chat SaaS — /etc/nginx/sites-available/default
# Enables WebSocket upgrade (required for live chat) and forwards to Node on :3000.
# IMPORTANT: get your real certbot SSL cert (see below) so browsers allow wss://.

server {
    listen 80 default_server;
    server_name divafits.com;      # <-- your public domain (or use the Oracle public IP)

    # Upload size for training JSON is tiny; no need to change.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # required for WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;                    # keep ws alive
    }
}