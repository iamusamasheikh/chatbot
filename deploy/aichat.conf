# Environment file for the AI Chat SaaS — copied to /etc/aichat.conf
# Fill in your values. NOTHING here should be committed to git in real life.

# Your public URL (once you have a domain: https://divafits.com)
PUBLIC_URL=http://localhost

# Server port the Node app listens on (nginx proxies 80/443 -> this)
PORT=3000

# Free OpenRouter API key (https://openrouter.ai/keys) — use a FRESH one
OPENROUTER_API_KEY=sk-or-v1-YOUR_FRESH_KEY

# Free model to use. Change if it 404s (see config.js for options)
LLM_MODEL=poolside/laguna-s-2.1:free

# A long random string to sign login tokens. Generate:  openssl rand -hex 32
JWT_SECRET=CHANGE_ME_TO_A_LONG_RANDOM_STRING

# Max pages to index per training run
TRAIN_MAX_PAGES=30

# Security: set to true in PRODUCTION so the widget only answers when the visitor's
# browser Origin matches the site's registered website URL (stops API/LLM abuse).
STRICT_ORIGIN=false

# --- OPTIONAL: AUTO-REFRESH training (Tidio-like) ---------------------------
# When > 0, the server re-crawls + re-indexes every site's website_url on its own
# every N minutes (no manual "Train" clicks). 0 = off (manual training only).
# Suggested production: AUTO_TRAIN_MINUTES=720  (every 12 hours)
AUTO_TRAIN_MINUTES=0

# --- OPTIONAL: Lead email notifications (nodemailer) ------------------------
# Set SMTP_HOST to enable. Example Gmail app password setup:
# SMTP_HOST=smtp.gmail.com
# SMTP_PORT=587
# SMTP_USER=you@gmail.com
# SMTP_PASS=your_app_password
# MAIL_FROM=you@gmail.com
# LEAD_NOTIFY_TO=you@gmail.com   (empty = sends to the site owner's account email)