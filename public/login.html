<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · AI Chat</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:linear-gradient(135deg,#2563eb,#7c3aed);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:400px;padding:32px}
  h1{font-size:22px;margin-bottom:4px;color:#111}
  .sub{color:#6b7280;font-size:13px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin:14px 0 6px}
  input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
  input:focus{border-color:#2563eb}
  .btn{width:100%;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:22px}
  .btn:disabled{opacity:.6}
  .switch{text-align:center;margin-top:16px;font-size:13px;color:#6b7280}
  .switch a{color:#2563eb;cursor:pointer;font-weight:600}
  .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px;font-size:13px;margin-top:14px;display:none}
  .logo{font-size:28px;text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🤖</div>
  <h1 id="title">Welcome back</h1>
  <div class="sub" id="subtitle">Sign in to your chatbot dashboard</div>
  <div class="err" id="err"></div>

  <form id="form" autocomplete="off">
    <label id="nameLabel" style="display:none">Your name</label>
    <input type="text" id="name" style="display:none" placeholder="Usama">
    <label>Email</label>
    <input type="email" id="email" required placeholder="you@company.com">
    <label>Password</label>
    <input type="password" id="password" required placeholder="••••••••" minlength="6">
    <button class="btn" id="submit" type="submit">Sign in</button>
  </form>

  <div class="switch">Don't have an account? <a id="toggle">Create one</a></div>
</div>

<script>
(function () {
  var mode = 'login';
  var title = document.getElementById('title');
  var subtitle = document.getElementById('subtitle');
  var submit = document.getElementById('submit');
  var toggle = document.getElementById('toggle');
  var err = document.getElementById('err');
  var nameField = document.getElementById('name');
  var nameLabel = document.getElementById('nameLabel');

  function setMode(m) {
    mode = m;
    title.textContent = m === 'login' ? 'Welcome back' : 'Create your account';
    subtitle.textContent = m === 'login' ? 'Sign in to your chatbot dashboard' : 'Start adding chatbots to your websites in minutes';
    submit.textContent = m === 'login' ? 'Sign in' : 'Create account';
    toggle.textContent = m === 'login' ? 'Create one' : 'Sign in instead';
    nameField.style.display = m === 'signup' ? 'block' : 'none';
    nameLabel.style.display = m === 'signup' ? 'block' : 'none';
  }

  toggle.addEventListener('click', function () {
    setMode(mode === 'login' ? 'signup' : 'login');
    err.style.display = 'none';
  });

  var emailField = document.getElementById('email');
  var passwordField = document.getElementById('password');

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var emailVal = (emailField.value || '').trim();
    var passVal = passwordField.value || '';
    var nameVal = (nameField.value || '').trim();
    var body = { email: emailVal, password: passVal };
    if (mode === 'signup') body.name = nameVal || emailVal.split('@')[0];
    submit.disabled = true; submit.textContent = 'Please wait…';
    fetch('/api/auth/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (d) {
      submit.disabled = false; submit.textContent = mode === 'login' ? 'Sign in' : 'Create account';
      if (d.error) { err.textContent = d.error; err.style.display = 'block'; return; }
      location.href = '/dashboard';
    }).catch(function () {
      submit.disabled = false; submit.textContent = 'Try again';
      err.textContent = 'Network error'; err.style.display = 'block';
    });
  });

  fetch('/api/auth/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d.user) location.href = '/dashboard';
  });
})();
</script>
</body>
</html>
